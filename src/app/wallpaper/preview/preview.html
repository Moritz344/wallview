<button class="close" (click)="close.emit()"><img src="close.svg" class="white-img"></button>
<button (click)="next.emit()" class="right"><img src="arrow.svg" class="white-img"></button>
<button (click)="prev.emit()" class="left"><img src="arrow.svg" class="left-arrow"></button>
<div class="screen"></div>
<div class="container">
  @if (isLoading() && !isLocal()) {
    <div class="loading-container">
      <span class="loader"></span>
    </div>
  }
  <img (load)="onLoad()" draggable="false" class="container-img" [class.loading]="isLoading()" [src]="path">
  @if (!isLoading()) {
  <div class="bottom-options">
    <span style="font-size: 20px;margin-top: 3px">{{ name }}</span>
    <div class="bottom-options-right">
      <button
        (mouseenter)="tooltip.showTooltip('Mark wallpaper as favourite',$event)"
        (mouseleave)="tooltip.hideTooltip()"
        (click)="onFavourite()" >
        @if (isMarkedAsFavourite()) {
          <img src="fav.svg" class="white-img">
        }@else {
          <img src="not_fav.svg" class="white-img">
        }
      </button>
      @if (isDownloaded()) {
        <button
        (mouseenter)="tooltip.showTooltip('Open wallpaper in folder',$event)"
        (mouseleave)="tooltip.hideTooltip()"
        (click)="onOpenPath()">
        <img width="20" src="open.svg" class="white-img"></button>
        <button
        (mouseenter)="tooltip.showTooltip('Apply Wallpaper',$event)"
        (mouseleave)="tooltip.hideTooltip()"
        [class.disabled]="isGnome() == false"
        (click)="onApplyWallpaper()">
        <img  src="display.svg" class="white-img"></button>
      }@else {
        <button
        (click)="onDownload()"
        ><img  src="download.svg" class="white-img"></button>
      }


    </div>
  </div>
  }
</div>

@if (tooltip.show()) {
  <app-tooltip></app-tooltip>
}
