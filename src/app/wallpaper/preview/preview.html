<button class="close" (click)="close.emit()"><img src="close.svg" class="white-img"></button>
<button (click)="next.emit()" class="right"><img src="arrow.svg" class="white-img"></button>
<button (click)="prev.emit()" class="left"><img src="arrow.svg" class="left-arrow"></button>
<div  class="screen"></div>
<div class="container">
  @if (isLoading() && !isDownloaded()) {
    <div class="loading-container">
      <span class="loader"></span>
    </div>
  }
  <img (load)="onLoad()" draggable="false" class="container-img" [src]="path">
  @if (!isLoading()) {
  <div class="bottom-options">
    <span style="font-size: 20px;margin-top: 3px">{{ name }}</span>
    <div class="bottom-options-right">
      <button (click)="onFavourite()" title="Mark as favourite">
        @if (isMarkedAsFavourite()) {
          <img src="fav.svg" class="white-img">
        }@else {
          <img src="not_fav.svg" class="white-img">
        }
      </button>
      @if (isDownloaded()) {
        <button (click)="onOpenPath()" title="Open wallpaper in folder"><img width="20" src="open.svg" class="white-img"></button>
      }@else {
        <button (click)="onDownload()" title="Download wallpaper"><img  src="download.svg" class="white-img"></button>
      }
    </div>
  </div>
  }
</div>
