<div class="screen" (click)="onClose()"></div>
<div class="container">
    <button [disabled]="settings.localWallpaperPath().length == 0" (click)="onOpenLocalWallpaperFolder()" class="round">Open Local Folder</button>
    <button (click)="onChangeLocalWallpaperPath()" class="round">Change Local Folder</button>
    <button (click)="onAbout()" class="round">About</button>
    <button (click)="onExit()" class="round">Quit</button>
</div>
